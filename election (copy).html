<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ELECTION PROCESS</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;font-family:'Segoe UI',Tahoma,Arial,sans-serif;overflow:hidden}
  body{background:linear-gradient(120deg,#ff6a88,#ff99ac,#fcb045,#7f7fd5,#2bc0e4);background-size:400% 400%;animation:bg 18s ease infinite}
  @keyframes bg{0%{background-position:0 50%}50%{background-position:100% 50%}100%{background-position:0 50%}}

  /* ---------- window ---------- */
  .win{position:fixed;inset:0;display:flex;flex-direction:column;background:linear-gradient(135deg,#1e3c72,#2a5298 40%,#6a11cb);transition:all .25s ease;overflow:hidden}
  .win.small{inset:8% 10%;border-radius:14px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
  .win.hidden{display:none}
  .titlebar{display:flex;align-items:center;gap:8px;padding:8px 12px;background:rgba(0,0,0,.35);color:#fff;flex:0 0 auto}
  .tb{width:16px;height:16px;border-radius:50%;border:none;cursor:pointer;font-size:10px;line-height:16px;color:rgba(0,0,0,.65);font-weight:700}
  .tb.close{background:#ff5f57}.tb.min{background:#febc2e}.tb.max{background:#28c840}
  .tb:hover{filter:brightness(1.15)}
  .tbtitle{margin-left:10px;font-size:13px;opacity:.85}
  h1.main{text-align:center;color:#fff;font-size:clamp(26px,4vw,48px);letter-spacing:6px;padding:14px 10px 10px;text-shadow:0 3px 10px rgba(0,0,0,.4);flex:0 0 auto}
  .cols{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:0;min-height:0}
  .col{padding:16px 28px 22px;display:flex;flex-direction:column;min-height:0}
  .col.left{background:linear-gradient(160deg,rgba(255,255,255,.14),rgba(255,255,255,.06));border-right:3px solid rgba(255,255,255,.5)}
  .col.right{background:linear-gradient(160deg,rgba(255,200,87,.22),rgba(255,106,136,.18))}
  .col h2{color:#fff;text-align:center;font-size:26px;letter-spacing:4px;margin-bottom:14px}

  /* ---------- left table ---------- */
  .tablewrap{flex:1;overflow:auto;border-radius:12px;background:rgba(255,255,255,.95);box-shadow:0 6px 20px rgba(0,0,0,.3)}
  table{width:100%;border-collapse:collapse}
  th{position:sticky;top:0;background:linear-gradient(90deg,#ff512f,#dd2476);color:#fff;padding:12px;font-size:16px;letter-spacing:2px}
  td{padding:10px 14px;border-bottom:1px solid #eee;font-size:17px;color:#222}
  td:first-child{width:90px;text-align:center;font-weight:700;color:#dd2476}
  tr:nth-child(even) td{background:#f6f1ff}
  .btn{margin-top:14px;padding:14px 20px;border:none;border-radius:12px;font-size:18px;font-weight:700;letter-spacing:2px;color:#fff;cursor:pointer;background:linear-gradient(90deg,#11998e,#38ef7d);box-shadow:0 6px 16px rgba(0,0,0,.3);transition:transform .1s}
  .btn:hover{transform:translateY(-2px)}
  .btn:disabled{opacity:.5;cursor:not-allowed}

  /* ---------- right ---------- */
  .right .mid{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center}
  textarea#nameBox{width:100%;height:55%;min-height:180px;max-height:420px;border:4px solid #fff;border-radius:18px;padding:18px;font-size:28px;resize:none;outline:none;background:rgba(255,255,255,.95);color:#222;box-shadow:0 8px 24px rgba(0,0,0,.35)}
  textarea#nameBox:focus{border-color:#ffd200}
  .hint{color:#fff;margin-top:12px;font-size:14px;opacity:.9;text-align:center}
  #status{margin-top:8px;color:#fff;font-weight:600;min-height:22px;text-align:center}

  /* ---------- dialogs ---------- */
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;z-index:50}
  .overlay.show{display:flex}
  .dialog{background:#fff;border-radius:18px;padding:28px 34px;min-width:320px;max-width:92vw;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.5)}
  .dialog h3{color:#2a5298;letter-spacing:2px;margin-bottom:16px}
  .dialog input{font-size:26px;width:140px;text-align:center;padding:10px;border:3px solid #6a11cb;border-radius:10px;outline:none}
  #qrBox{display:flex;justify-content:center;margin:14px 0}
  .small-note{font-size:12px;color:#555;word-break:break-all;margin-top:8px}

  /* ---------- minimised pill / closed ---------- */
  #pill{position:fixed;left:16px;bottom:16px;padding:10px 18px;border-radius:30px;background:#2a5298;color:#fff;cursor:pointer;display:none;z-index:60;box-shadow:0 6px 18px rgba(0,0,0,.4)}
  #closed{position:fixed;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;color:#fff;gap:16px;z-index:70;font-size:22px;background:rgba(0,0,0,.6)}
  #closed button{padding:10px 22px;font-size:16px;border:none;border-radius:10px;cursor:pointer}

  /* ---------- voter mode ---------- */
  #voter{display:none;height:100%;overflow:auto;padding:16px}
  .card{max-width:520px;margin:0 auto;background:#fff;border-radius:20px;padding:22px;box-shadow:0 14px 40px rgba(0,0,0,.35)}
  .card h2{text-align:center;color:#6a11cb;letter-spacing:3px;margin-bottom:14px}
  .field{margin-bottom:12px}
  .field label{display:block;font-weight:700;font-size:13px;letter-spacing:1px;color:#2a5298;margin-bottom:4px}
  .field input{width:100%;padding:12px;font-size:18px;border:2px solid #bbb;border-radius:10px;outline:none}
  .field input:focus{border-color:#6a11cb}
  .limitline{text-align:center;font-weight:600;margin:6px 0 12px;color:#dd2476}
  .row{display:flex;align-items:center;justify-content:space-between;padding:12px 10px;border-bottom:1px solid #eee;font-size:19px}
  .row input{width:26px;height:26px;accent-color:#dd2476}
  .row input:disabled{opacity:.35}
  #voter .btn{width:100%}
  #toast{position:fixed;left:50%;top:20px;transform:translateX(-50%);padding:14px 26px;border-radius:12px;color:#fff;font-weight:700;font-size:18px;z-index:100;display:none;box-shadow:0 8px 24px rgba(0,0,0,.4)}
  #toast.ok{background:#1faa59}#toast.err{background:#e53935}

  @media(max-width:700px){.cols{grid-template-columns:1fr 1fr}.col{padding:10px}textarea#nameBox{font-size:18px}}
</style>
</head>
<body>

<!-- ============ CONFIGURATION (edit these two lines) ============ -->
<script>
  // 1) Paste the Web App URL you get after deploying Code.gs (see instructions)
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyXMPX4fuqA7o8xuoT0pSZBTbRN62oVo6a3IXVfj5uVAdaLWq4tlnR7OdU9ChcQ-wT8Sg/exec";
  // 2) The public address where THIS html file is hosted (needed so phones can open it from the QR code).
  //    Leave empty only if you open this file from a web address already.
  const PUBLIC_URL = "https://github.com/maqboolkite-ops/election.git";
</script>

<!-- ============ ADMIN WINDOW ============ -->
<div class="win" id="win">
  <div class="titlebar">
    <button class="tb close" id="bClose" title="Close">✕</button>
    <button class="tb min"   id="bMin"   title="Minimise">–</button>
    <button class="tb max"   id="bMax"   title="Resize">+</button>
    <span class="tbtitle">Election Process</span>
  </div>
  <h1 class="main">ELECTION PROCESS</h1>
  <div class="cols">
    <div class="col left">
      <div class="tablewrap">
        <table>
          <thead><tr><th>SL.NO</th><th>NOMINATIONS</th></tr></thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>
      <button class="btn" id="finishBtn">NOMINATION FINISHED</button>
    </div>
    <div class="col right">
      <h2>NOMINATION</h2>
      <div class="mid">
        <textarea id="nameBox" placeholder="Type a name and press Enter" autofocus></textarea>
        <div class="hint">Press <b>Enter</b> to add the name (Shift+Enter for a new line)</div>
        <div id="status"></div>
      </div>
    </div>
  </div>
</div>

<div id="pill">▣ ELECTION PROCESS – click to restore</div>
<div id="closed"><div>Window closed</div><button id="reopen">Reopen</button></div>

<!-- number of persons dialog -->
<div class="overlay" id="limitOv">
  <div class="dialog">
    <h3>NUMBER OF PERSONS TO BE ELECTED</h3>
    <input type="number" id="limitInput" min="1" step="1"><br><br>
    <button class="btn" id="submitLimit">SUBMIT</button>
  </div>
</div>

<!-- QR dialog -->
<div class="overlay" id="qrOv">
  <div class="dialog">
    <h3>SCAN TO VOTE</h3>
    <div id="qrBox"></div>
    <div id="qrInfo"></div>
    <div class="small-note" id="qrUrl"></div>
    <button class="btn" id="qrClose" style="background:linear-gradient(90deg,#ff512f,#dd2476)">CLOSE</button>
  </div>
</div>

<!-- ============ VOTER PAGE (shown when opened from QR) ============ -->
<div id="voter">
  <div class="card">
    <h2>CAST YOUR VOTE</h2>
    <div class="field"><label>NAME</label><input id="vName" type="text" autocomplete="name"></div>
    <div class="field"><label>PHONE NUMBER</label><input id="vPhone" type="tel" inputmode="numeric" maxlength="10" placeholder="10 digit number"></div>
    <div class="limitline" id="limitLine"></div>
    <div id="vList"></div>
    <br>
    <button class="btn" id="vSubmit">SUBMIT</button>
  </div>
</div>
<div id="toast"></div>

<script>
const $ = id => document.getElementById(id);
const configured = SCRIPT_URL && !SCRIPT_URL.startsWith("PASTE_");
const isVoter = new URLSearchParams(location.search).get("vote") === "1";

function toast(msg, type="ok", ms=2500){
  const t=$("toast"); t.textContent=msg; t.className=type; t.style.display="block";
  clearTimeout(toast._t); toast._t=setTimeout(()=>t.style.display="none",ms);
}
async function api(payload){
  const r = await fetch(SCRIPT_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(payload)});
  return r.json();
}
async function apiGet(){
  const r = await fetch(SCRIPT_URL+"?t="+Date.now()); return r.json();
}

/* =====================  ADMIN MODE  ===================== */
let nominees = [];
function initAdmin(){
  const win=$("win");
  $("bMin").onclick=()=>{win.classList.add("hidden");$("pill").style.display="block"};
  $("pill").onclick=()=>{win.classList.remove("hidden");$("pill").style.display="none"};
  $("bMax").onclick=()=>win.classList.toggle("small");
  $("bClose").onclick=()=>{ if(confirm("Close the Election window?")){ window.close(); win.classList.add("hidden"); $("closed").style.display="flex"; } };
  $("reopen").onclick=()=>{$("closed").style.display="none";win.classList.remove("hidden");$("nameBox").focus()};

  if(!configured) $("status").textContent="⚠ SCRIPT_URL not set – names will show here but NOT reach the spreadsheet";

  const box=$("nameBox");
  box.addEventListener("keydown",async e=>{
    if(e.key!=="Enter"||e.shiftKey) return;
    e.preventDefault();
    const name=box.value.trim().replace(/\s+/g," ");
    if(!name) return;
    if(nominees.some(n=>n.toLowerCase()===name.toLowerCase())){ $("status").textContent="“"+name+"” is already nominated"; return; }
    box.disabled=true; $("status").textContent="Posting…";
    let posted=true;
    if(configured){
      try{ const r=await api({action:"addNominee",name}); posted=r.ok; }catch(err){ posted=false; }
    }
    nominees.push(name);
    addRow(nominees.length,name);
    box.value=""; box.disabled=false; box.focus();
    $("status").textContent = posted ? "✔ Added: "+name : "⚠ Added on screen but could not post to spreadsheet";
  });

  $("finishBtn").onclick=()=>{
    if(!nominees.length){ alert("Please add at least one nomination."); return; }
    $("limitOv").classList.add("show"); $("limitInput").focus();
  };
  $("submitLimit").onclick=async()=>{
    const n=parseInt($("limitInput").value,10);
    if(!n||n<1){ alert("Enter a valid number."); return; }
    if(n>nominees.length){ alert("Number cannot exceed the number of nominations ("+nominees.length+")."); return; }
    if(configured){ try{ await api({action:"setLimit",limit:n}); }catch(e){ alert("Could not save the number to the spreadsheet script."); return; } }
    $("limitOv").classList.remove("show");
    showQR(n);
  };
  $("qrClose").onclick=()=>$("qrOv").classList.remove("show");
}
function addRow(sl,name){
  const tr=document.createElement("tr");
  const a=document.createElement("td"); a.textContent=sl;
  const b=document.createElement("td"); b.textContent=name;
  tr.append(a,b); $("tbody").appendChild(tr);
  tr.scrollIntoView({block:"nearest"});
}
function showQR(limit){
  const base=(PUBLIC_URL||location.href.split("?")[0].split("#")[0]);
  const url=base+"?vote=1";
  $("qrBox").innerHTML="";
  new QRCode($("qrBox"),{text:url,width:260,height:260,correctLevel:QRCode.CorrectLevel.M});
  $("qrInfo").textContent="Voters may choose "+limit+" name(s)";
  $("qrUrl").textContent=url;
  $("qrOv").classList.add("show");
}

/* =====================  VOTER MODE  ===================== */
let vNames=[], vLimit=0;
async function initVoter(){
  document.body.style.overflow="auto";
  $("win").style.display="none"; $("voter").style.display="block";
  if(!configured){ $("vList").textContent="Voting is not configured (SCRIPT_URL missing)."; return; }
  $("vList").textContent="Loading names…";
  try{
    const s=await apiGet(); vNames=s.names.map(n=>n.name); vLimit=s.limit;
  }catch(e){ $("vList").textContent="Could not load names. Please try again."; return; }
  $("limitLine").textContent="Select exactly "+vLimit+" name(s)";
  const list=$("vList"); list.innerHTML="";
  vNames.forEach((n,i)=>{
    const row=document.createElement("label"); row.className="row";
    const sp=document.createElement("span"); sp.textContent=(i+1)+". "+n;
    const cb=document.createElement("input"); cb.type="checkbox"; cb.value=n; cb.disabled=true;
    cb.addEventListener("change",()=>{
      if(cb.checked && checked().length>vLimit){ cb.checked=false; toast("You exceeding the limit","err"); }
    });
    row.append(sp,cb); list.appendChild(row);
  });
  const refresh=()=>{
    const ok=$("vName").value.trim().length>0 && /^\d{10}$/.test($("vPhone").value);
    list.querySelectorAll("input").forEach(c=>{ c.disabled=!ok; if(!ok) c.checked=false; });
  };
  $("vName").addEventListener("input",refresh);
  $("vPhone").addEventListener("input",e=>{ e.target.value=e.target.value.replace(/\D/g,"").slice(0,10); refresh(); });
  $("vSubmit").onclick=submitVote;
}
const checked=()=>[...document.querySelectorAll("#vList input:checked")].map(c=>c.value);
async function submitVote(){
  const name=$("vName").value.trim(), phone=$("vPhone").value, sel=checked();
  if(!name||!/^\d{10}$/.test(phone)){ toast("Enter your name and a 10 digit phone number","err",3000); return; }
  if(sel.length!==vLimit){ toast("Please select exactly "+vLimit+" name(s)","err",3000); return; }
  $("vSubmit").disabled=true;
  try{
    const r=await api({action:"vote",voterName:name,phone,names:sel});
    if(r.ok){
      toast("Successfully submitted","ok",3000);
      $("vName").value=""; $("vPhone").value="";
      document.querySelectorAll("#vList input").forEach(c=>{c.checked=false;c.disabled=true});
    } else toast(r.error||"Submission failed","err",3500);
  }catch(e){ toast("Network error – please try again","err",3500); }
  $("vSubmit").disabled=false;
}

isVoter ? initVoter() : initAdmin();
</script>
</body>
</html>
